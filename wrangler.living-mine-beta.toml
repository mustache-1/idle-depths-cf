# Separate preview Worker. Never run this against production accidentally.
name = "idle-depths-living-mine-preview"
main = "src/index.js"
compatibility_date = "2026-01-01"
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
[[durable_objects.bindings]]
name = "LIVING_MINE"
class_name = "LivingMinePlayer"
[[migrations]]
tag = "living-mine-v1"
new_sqlite_classes = ["LivingMinePlayer"]
